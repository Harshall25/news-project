name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://localhost:5432/news_project"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-nextauth-secret"
      GOOGLE_ID: "ci-google-id"
      GOOGLE_SECRET: "ci-google-secret"
      GOOGLE_GEMINI_API: "ci-gemini-api"
      NEWS_API: "ci-news-api"
      UPSTASH_REDIS_REST_URL: "https://localhost:8080"
      UPSTASH_REDIS_REST_TOKEN: "ci-redis-token"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
