# Workflow name shown in GitHub Actions UI
name: Test and Build

# Trigger workflow when code is pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  # Single job responsible for testing and building the project
  test-build:

    # GitHub-hosted runner environment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code into the runner
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Install Node.js environment required for the project
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 23      # Node version used for build/test
          cache: npm            # Cache npm dependencies to speed up future runs

      # Step 3: Install project dependencies using package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Execute test suite
      - name: Run tests
        run: npm test

      